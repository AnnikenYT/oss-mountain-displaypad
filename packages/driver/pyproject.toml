[project]
name = "displaypad-driver"
version = "1.2.0"

description = "A Driver to communicate with the mountain displaypad."
authors = [
    {name = "AnnikenToGo",email = "anniken@annikentogo.de"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow (>=12.1.0,<13.0.0)",
    "pyusb (>=1.3.1,<2.0.0)"
]
keywords = ["displaypad", "mountain", "driver", "library", "python", "usb", "hid"]
dynamic = [ "classifiers" ]

[project.urls]
homepage = "https://annikentogo.de"
repository = "https://github.com/AnnikenYT/oss-mountain-displaypad"
documentation = "https://github.com/annikenyt/oss-mountain-displaypad/wiki"
"Bug Tracker" = "https://github.com/AnnikenYT/oss-mountain-displaypad/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Human Interface Device (HID)"
]